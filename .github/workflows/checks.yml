name: checks

on:
  push:
  pull_request:

jobs:
  engine:
    name: engine gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install ast-grep
        run: npm install -g @ast-grep/cli
      - name: CLI build + tests
        run: |
          npm install --no-audit --no-fund
          npm --workspace packages/cli test
      - name: Rule-pack tests
        run: |
          for pack in packs/*/; do
            echo "--- $pack"
            (cd "$pack" && ast-grep test)
          done
      - name: Core unit tests
        run: python3 -m unittest discover -s packages/core/tests -v
      - name: Codex shim unit tests
        run: python3 packages/shims/codex/test_claude_compat.py
      - name: OpenCode plugin smoke test
        run: node packages/shims/opencode/smoke-test.js
      - name: End-to-end payload replay
        run: python3 e2e/run.py
      - name: Golden stays clean (pinned at 0)
        run: |
          total=$(python3 packages/core/src/audit.py apps/golden --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')
          echo "golden audit: $total"
          test "$total" = "0"
      - name: Broken audit count pin
        # The number quoted on stage and in the wiki. If a rule or the broken
        # app changes this, the change must be deliberate: update the pin in
        # the same commit and say why.
        run: |
          total=$(python3 packages/core/src/audit.py apps/broken --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["total"])')
          echo "broken audit: $total"
          test "$total" = "52"

  apps:
    name: android apps build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Golden assembles + tests
        working-directory: apps/golden
        run: ./gradlew assembleDebug test --console=plain
      - name: Broken assembles + tests
        working-directory: apps/broken
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :legacy:test --console=plain

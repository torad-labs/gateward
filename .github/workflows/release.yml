name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: full verify before release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: .bun-version
          # Release publishes artifacts; caching the toolchain is a
          # cache-poisoning vector (zizmor high). Install fresh each release.
          no-cache: true
      - name: Install ast-grep
        run: |
          bun add -g @ast-grep/cli
          ast-grep --version
      - name: Install workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify (every layer)
        run: bun run verify

  github-release:
    name: publish GitHub release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true

  # npm publish and `bun build --compile` binaries are deliberately absent:
  # the CLI resolves packs/ and the engine as repo siblings (see
  # packages/cli/src/paths.ts), so publishing standalone needs a packaging
  # step that bundles them into the artifact. Tracked on the README roadmap;
  # faking it here would ship a broken install.

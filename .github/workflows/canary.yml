name: bun-canary

# Early warning, not a gate: runs the full suite weekly against Bun's canary
# build so upcoming runtime changes surface here before they land in a
# release. Failures do not block merges.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canary:
    name: full suite on bun canary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: canary
      - name: Install ast-grep
        run: |
          bun add -g @ast-grep/cli
          ast-grep --version
      - name: Install workspace dependencies
        # No --frozen-lockfile: canary may resolve slightly differently, and
        # this job is a forecast, not a gate.
        run: bun install
      - name: Verify (every layer)
        run: bun run verify
      - name: Dependency audit
        run: bun audit

id: no-usecase-composing-usecase
language: kotlin
severity: error
message: >-
  This house style allows a UseCase to depend on another UseCase — enable
  this rule only if your team requires UseCases to depend on Repositories
  alone.
metadata:
  tier: deny
rule:
  kind: class_parameter
  has:
    kind: user_type
    has:
      kind: type_identifier
      regex: 'UseCase$'
  inside:
    kind: primary_constructor
    inside:
      kind: class_declaration
      has:
        kind: type_identifier
        regex: 'UseCase$'
